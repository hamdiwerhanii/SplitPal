name: CI app

on:
  push:
    branches: [main]
    paths: ["splitpal-app/**", ".github/workflows/ci-app.yml"]
  pull_request:
    paths: ["splitpal-app/**", ".github/workflows/ci-app.yml"]

defaults:
  run:
    working-directory: splitpal-app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: splitpal-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform android --output-dir dist-check
